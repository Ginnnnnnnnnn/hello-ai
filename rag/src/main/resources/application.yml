server:
  port: 8006
  servlet:
    context-path: /rag
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: rag
  profiles:
    active: @profiles.active@
  datasource:
    url: jdbc:postgresql://localhost:5432/hello-ai
    username: xxx
    password: xxx
  ai:
    dashscope:
      api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 768
    vectorstore:
      pgvector:
        # 向量索引类型
        index-type: HNSW
        # 距离度量，余弦值
        distance-type: COSINE_DISTANCE
        # 向量维度
        dimensions: 768
        # 批量处理大小
        max-document-batch-size: 9
        # 启动时是否自动创建表
        initialize-schema: true
        # 创建的表名
        table-name: vector_st