server:
  port: 8005
  servlet:
    context-path: /mcp/client
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: mcp-client
  profiles:
    active: @profiles.active@
  ai:
    dashscope:
      api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    mcp:
      client:
        name: my-mcp-client
        version: 1.0.0
        enabled: true
        request-timeout: 60s
        type: SYNC
        stdio:
          connections:
            weather-stdio:
              command: java
              args:
                - -jar
                - "C:\\work\\AI\\hello-ai\\mcp\\mcp-server-stdio\\target\\mcp-server-stdio-1.0-SNAPSHOT.jar"
        sse:
          connections:
            weather-sse:
              url: http://localhost:8003
              sse-endpoint: /sse
        streamable-http:
          connections:
            weather-streamable:
              url: http://localhost:8004
              endpoint: /api/mcp